<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1eb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Cadence Library</title><style>
:root{--bg:#f4f1eb;--ink:#171717;--muted:#77736b;--line:rgba(23,23,23,.12);--sage:#6B7D68;--amber:#C58A4A;--blue:#657C93}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}.shell{width:min(1500px,calc(100% - 22px));margin:auto}
header{position:sticky;top:0;z-index:20;padding:14px 0 8px;background:linear-gradient(to bottom,rgba(244,241,235,.97) 80%,rgba(244,241,235,0));backdrop-filter:blur(14px)}
.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{margin:0;font-family:Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,58px);letter-spacing:-.04em;line-height:.95}
.sub,.count{color:var(--muted);font-size:12px}.sub{margin-top:6px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 0 8px}
.search,.select{height:42px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.58);padding:0 14px;outline:none}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.5);padding:8px 12px;color:var(--muted)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}.syncbar{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;color:var(--muted);padding:3px 0 8px}
.syncbar button{border:none;background:none;padding:4px 0;text-decoration:underline;color:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:14px;padding:10px 0 70px}
.book{min-width:0;animation:in .32s both}@keyframes in{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}
.coverwrap{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:15px;box-shadow:0 10px 25px rgba(30,25,18,.11);background:#ddd}
.cover{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}.cover.loaded{opacity:1}
.fallback{position:absolute;inset:0;padding:14px;display:grid;align-content:space-between;color:rgba(20,20,20,.9)}
.fallback-title{font-family:Georgia,serif;font-size:18px;line-height:1.03;letter-spacing:-.03em}.fallback-author{font-size:10px;text-transform:uppercase;letter-spacing:.07em;opacity:.7}
.dot{position:absolute;z-index:2;top:9px;right:9px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.13)}
.meta{padding:8px 2px 0}.title{font-weight:650;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.author{font-size:11px;color:var(--muted);margin-top:3px}.micro{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.micro span{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 5px}
.empty{display:none;text-align:center;color:var(--muted);padding:70px 0}@media(min-width:800px){.controls{grid-template-columns:minmax(260px,1fr) auto auto}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px}}
</style></head><body>
<header><div class="shell"><div class="top"><div><h1>Cadence</h1><div class="sub">Books & audiobooks</div></div><div class="count" id="count"></div></div>
<div class="controls"><input class="search" id="search" type="search" placeholder="Search title or author…"><select class="select" id="sort"><option value="title">A–Z</option><option value="semantic">Read state</option><option value="status">Detailed status</option><option value="genre">Genre</option><option value="color">Cover color</option></select><select class="select" id="direction"><option value="asc">Ascending</option><option value="desc">Descending</option></select></div>
<div class="filters" id="filters"></div><div class="syncbar"><span id="syncStatus">Covers load progressively and are cached on this device.</span><button id="refreshCovers">Refresh covers</button></div></div></header>
<main class="shell"><section class="grid" id="grid"></section><div class="empty" id="empty">No books match this view.</div></main><script>
const BOOKS = /*__BOOKS__*/[]/*__END__*/;
const state={filter:"all",sort:"title",direction:"asc",query:""};
const semanticColors={read:"#6B7D68",reading:"#C58A4A",want:"#657C93"}, semanticLabels={read:"Read",reading:"Reading",want:"Want to read"};
const statusOrder=["reading","owned","borrowed","wishlist","finished","uncertain","leslie"];
const spineInks=["#6B5B4A","#8A5B44","#4C5B63","#6B7D68","#8A7645","#5A4E63","#7A4F4F","#48605A"];
const grid=document.querySelector("#grid"),count=document.querySelector("#count"),filters=document.querySelector("#filters"),search=document.querySelector("#search"),sort=document.querySelector("#sort"),direction=document.querySelector("#direction"),empty=document.querySelector("#empty"),syncStatus=document.querySelector("#syncStatus");

function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
BOOKS.forEach((b,i)=>{b._id=i;b._title=(b.title||"").trim();b._author=(b.author||"").trim()||"Author unknown";b._status=(b.status||"").trim().toLowerCase();b._genre="";b._cover="";b._rgb=null;b._ink=spineInks[hash(b._title+b._author)%spineInks.length];b._tried=false});

function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function statusLabel(s=""){return s?s[0].toUpperCase()+s.slice(1):"Unspecified"}
function rgbHue(rgb){if(!rgb)return 9999;let[r,g,b]=rgb.map(x=>x/255),max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return h}

/* --- cover cache (IndexedDB, all calls fail soft) --- */
function dbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open("cadence-library",1);q.onupgradeneeded=()=>q.result.createObjectStore("covers");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbGet(k){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction("covers","readonly").objectStore("covers").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbSet(k,v){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction("covers","readwrite");tx.objectStore("covers").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function dbClear(){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction("covers","readwrite");tx.objectStore("covers").clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

/* --- query cleanup: Amazon/Audible titles are truncated and tagged --- */
function cleanTitle(t){
  return t.replace(/\s*\((Unabridged|Abridged|[^)]*Edition[^)]*|Travel Guide|Vintage International|[^)]*Book Club[^)]*)\)\s*/gi," ")
          .replace(/:\s.*$/,"")
          .replace(/\s+[A-Za-z]{1,3}$/,"")
          .replace(/\s{2,}/g," ").trim()}
function cleanAuthor(a){return a.split(/[,;]/)[0].replace(/\s-\s.*$/,"").trim()}

async function ensureCover(b){
  const key=`${b._title}|${b._author}`;
  try{const c=await dbGet(key);if(c){b._cover=c.url||"";b._genre=c.genre||"";b._rgb=c.rgb||null;return !!b._cover}}catch(e){}
  let hit=null;
  try{
    const u=new URL("https://openlibrary.org/search.json");
    u.searchParams.set("title",cleanTitle(b._title));
    if(b.author)u.searchParams.set("author",cleanAuthor(b._author));
    u.searchParams.set("limit","1");
    u.searchParams.set("fields","cover_i,subject,title,author_name");
    const r=await fetch(u);
    if(r.ok){const d=await r.json();hit=d.docs&&d.docs[0]}
  }catch(e){}
  if(!hit||!hit.cover_i){try{await dbSet(key,{url:"",genre:"",rgb:null})}catch(e){}return false}
  const cover=`https://covers.openlibrary.org/b/id/${hit.cover_i}-M.jpg`;
  const genre=Array.isArray(hit.subject)&&hit.subject.length?String(hit.subject[0]).split("--")[0].slice(0,50):"";
  const rgb=await sampleImageColor(cover);
  b._cover=cover;b._genre=genre;b._rgb=rgb;
  try{await dbSet(key,{url:cover,genre,rgb})}catch(e){}
  return true
}

async function sampleImageColor(url){
  try{
    const img=new Image();img.crossOrigin="anonymous";img.src=url;
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});
    const c=document.createElement("canvas");c.width=16;c.height=24;
    const x=c.getContext("2d",{willReadFrequently:true});
    x.drawImage(img,0,0,16,24);
    const d=x.getImageData(0,0,16,24).data;
    let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=16){if(d[i+3]<180)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}
    return n?[Math.round(r/n),Math.round(g/n),Math.round(b/n)]:null
  }catch(e){return null}
}

/* --- lazy enrichment: 6 workers, driven by what is on screen --- */
const queue=[];let running=0,fetched=0,attempted=0;
function pump(){
  while(running<6&&queue.length){
    const job=queue.shift();running++;
    ensureCover(job.book).then(ok=>{if(ok)paintCover(job.book)}).catch(()=>{}).finally(()=>{
      running--;attempted++;
      if(!queue.length&&!running)syncStatus.textContent=`${fetched} of ${attempted} covers found. Cached on this device.`;
      else syncStatus.textContent=`Loading covers… ${attempted}`;
      pump()
    })
  }
}
function paintCover(b){
  if(!b._cover)return;fetched++;
  document.querySelectorAll(`.book[data-id="${b._id}"] .coverwrap`).forEach(w=>{
    if(w.querySelector("img.cover"))return;
    const img=new Image();img.className="cover";img.alt=`Cover of ${b._title}`;
    img.onload=()=>img.classList.add("loaded");img.onerror=()=>img.remove();
    img.src=b._cover;w.insertBefore(img,w.querySelector(".dot"))
  })
}
const io=new IntersectionObserver(es=>{
  for(const e of es){
    if(!e.isIntersecting)continue;
    io.unobserve(e.target);
    const b=BOOKS[+e.target.dataset.id];
    if(b._tried)continue;b._tried=true;
    if(b._cover){paintCover(b);continue}
    queue.push({book:b})
  }
  pump()
},{rootMargin:"600px 0px"});

function renderFilters(){
  const groups=[["all","All"],["read","Read"],["reading","Reading"],["want","Want to read"]];
  filters.innerHTML=groups.map(([k,l])=>`<button class="chip ${k==="all"?"active":""}" data-k="${k}">${l}</button>`).join("")
    +`<span style="width:1px;background:var(--line);margin:2px"></span>`
    +[...new Set(BOOKS.map(b=>b._status))].map(s=>`<button class="chip" data-k="status:${esc(s)}">${statusLabel(s)}</button>`).join("");
  filters.querySelectorAll(".chip").forEach(btn=>btn.onclick=()=>{state.filter=btn.dataset.k;filters.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()})
}
function cmp(a,b){
  let av,bv;
  if(state.sort==="semantic"){let o=["read","reading","want"];av=o.indexOf(a._semantic);bv=o.indexOf(b._semantic)}
  else if(state.sort==="status"){av=statusOrder.indexOf(a._status);bv=statusOrder.indexOf(b._status);if(av<0)av=999;if(bv<0)bv=999}
  else if(state.sort==="genre"){av=(a._genre||"zzzz").toLowerCase();bv=(b._genre||"zzzz").toLowerCase()}
  else if(state.sort==="color"){av=rgbHue(a._rgb);bv=rgbHue(b._rgb)}
  else{av=a._title.toLowerCase();bv=b._title.toLowerCase()}
  let r=typeof av==="number"?av-bv:String(av).localeCompare(String(bv));
  if(!r)r=a._title.localeCompare(b._title);
  return state.direction==="asc"?r:-r
}
function visible(){
  const q=state.query.toLowerCase();
  return BOOKS.filter(b=>{
    const ok=state.filter==="all"||b._semantic===state.filter||(state.filter.startsWith("status:")&&b._status===state.filter.split(":")[1]);
    const sq=!q||`${b._title} ${b._author}`.toLowerCase().includes(q);
    return ok&&sq
  }).sort(cmp)
}
function card(b,i){
  const c=semanticColors[b._semantic]||"#888";
  const details=[`<span>${semanticLabels[b._semantic]}</span>`,b.format?`<span>${esc(b.format)}</span>`:"",b._genre?`<span>${esc(b._genre)}</span>`:""].join("");
  const img=b._cover?`<img class="cover loaded" src="${esc(b._cover)}" alt="Cover of ${esc(b._title)}">`:"";
  return `<article class="book" data-id="${b._id}" style="animation-delay:${Math.min(i,25)*10}ms"><div class="coverwrap"><div class="fallback" style="background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(0,0,0,.16) 90%),${b._ink}"><div class="fallback-title">${esc(b._title)}</div><div class="fallback-author">${esc(b._author)}</div></div>${img}<i class="dot" style="background:${c}"></i></div><div class="meta"><div class="title">${esc(b._title)}</div><div class="author">${esc(b._author)}</div><div class="micro">${details}</div></div></article>`
}
function render(){
  const books=visible();
  count.textContent=`${books.length} of ${BOOKS.length}`;
  grid.innerHTML=books.map(card).join("");
  empty.style.display=books.length?"none":"block";
  grid.querySelectorAll("img.cover").forEach(img=>{img.onerror=()=>img.remove()});
  grid.querySelectorAll(".book").forEach(el=>io.observe(el))
}

search.oninput=e=>{state.query=e.target.value.trim();render()};
sort.onchange=e=>{state.sort=e.target.value;render()};
direction.onchange=e=>{state.direction=e.target.value;render()};
document.querySelector("#refreshCovers").onclick=async()=>{
  try{await dbClear()}catch(e){}
  BOOKS.forEach(b=>{b._cover="";b._genre="";b._rgb=null;b._tried=false});
  fetched=0;attempted=0;queue.length=0;
  syncStatus.textContent="Cover cache cleared. Reloading…";render()
};
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
renderFilters();render();

</script></body></html>
