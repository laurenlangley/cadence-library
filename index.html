<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1eb"><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon-192.png"><title>Cadence</title>
<style>
:root{--bg:#f4f1eb;--ink:#171717;--line:rgba(30,25,18,.15);--read:#6B7D68;--reading:#C58A4A;--want:#657C93}
*{box-sizing:border-box}

.shell{max-width:1180px;margin:0 auto;padding:0 18px}

.select,.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:999px;padding:9px 15px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}

.chip{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.syncbar{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:11px;opacity:.75;padding:0 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.syncbar button{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font:inherit;font-size:11px;color:var(--ink);cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:20px 14px;padding:22px 0 60px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 18px}}
.book{min-width:0;animation:in .32s both;cursor:pointer}
@keyframes in{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}
.coverwrap{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:15px;box-shadow:0 10px 25px rgba(30,25,18,.11);background:#ddd}

.title{font-family:Georgia,serif;font-size:14px;line-height:1.2;letter-spacing:-.015em;margin-bottom:3px}

/* --- sheets: detail, triage, add, settings --- */
.scrim{position:fixed;inset:0;background:rgba(28,24,18,.42);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;max-height:93vh;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -14px 50px rgba(30,25,18,.28);z-index:50;transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overscroll-behavior:contain}
.sheet.open{transform:translateY(0)}
@media(min-width:760px){.sheet{inset:0;max-height:none;border-radius:0;max-width:720px;margin:0 auto;box-shadow:0 0 70px rgba(30,25,18,.3)}}
.sheet-bar{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 11px;border-bottom:1px solid var(--line)}
.grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--line)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px calc(44px + env(safe-area-inset-bottom))}
.d-head{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:start}
.d-cover{position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;box-shadow:0 8px 22px rgba(30,25,18,.16);background:#ddd}
.d-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-title{font-family:Georgia,serif;font-size:27px;line-height:1.08;letter-spacing:-.025em;margin:0 0 5px;font-weight:400}
.d-author{font-size:13px;opacity:.72;margin:0 0 12px}
/* state selector */
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:24px 0 0}
.state-btn{appearance:none;border:1px solid var(--line);background:transparent;border-radius:13px;padding:13px 6px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:7px;line-height:1.2;text-align:center}
.state-btn i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.16)}
.state-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.state-btn.on i{box-shadow:0 0 0 2px var(--bg)}
.hint{font-size:11.5px;opacity:.5;margin:9px 0 0;line-height:1.45}
.facts{margin:26px 0 0;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:128px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.fact dt{opacity:.55;text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;padding-top:2px}
.fact dd{margin:0;word-break:break-word}
.fact dd a{color:inherit}
.notes{margin-top:30px}
.notes h2{font-family:Georgia,serif;font-size:15px;margin:0 0 4px;font-weight:400}
.notes .rule{height:1px;background:var(--ink);opacity:.85;margin-bottom:16px}
.note-md{font-size:14.5px;line-height:1.62}

.note-md ul{margin:0 0 13px;padding-left:17px}
.note-md li{margin:0 0 8px}

/* triage */
.tri-wrap{display:grid;justify-items:center;gap:20px;padding:8px 0 0}
.tri-prog{font-size:11px;text-transform:uppercase;letter-spacing:.11em;opacity:.5}
.tri-cover{width:min(62vw,210px);aspect-ratio:2/3;border-radius:15px;overflow:hidden;position:relative;box-shadow:0 14px 34px rgba(30,25,18,.2);background:#ddd}
.tri-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tri-title{font-family:Georgia,serif;font-size:23px;line-height:1.12;letter-spacing:-.025em;text-align:center;margin:0}
.tri-author{font-size:12.5px;opacity:.65;text-align:center;margin:5px 0 0}
.tri-meta{font-size:10px;text-transform:uppercase;letter-spacing:.09em;opacity:.45;text-align:center}
.tri-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:4px}

.tri-skip button{appearance:none;background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink);opacity:.5;text-decoration:underline;cursor:pointer;padding:8px}
/* forms */
.field{margin:0 0 15px}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;opacity:.55;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:12px;padding:11px 13px;font:inherit;font-size:15px;color:var(--ink)}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:9px;margin-top:20px}
.actions .btn{flex:1;text-align:center;padding:13px}
.note-status{font-size:12px;margin-top:12px;min-height:17px}
.note-status.err{color:#8A3B3B}
.note-status.ok{color:var(--read)}
.danger{margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.danger h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;opacity:.55;margin:0 0 9px;font-weight:400}
.del-btn{appearance:none;width:100%;border:1px solid rgba(138,59,59,.45);background:transparent;color:#8A3B3B;border-radius:13px;padding:12px;font:inherit;font-size:13.5px;cursor:pointer}
.del-btn:active{background:rgba(138,59,59,.07)}
.del-confirm{display:grid;gap:8px}
.del-confirm p{margin:0 0 4px;font-size:13px;line-height:1.5}

.pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.pill i{width:8px;height:8px;border-radius:50%}
.changelist{margin:14px 0 0;font-size:13px;border-top:1px solid var(--line)}
.changelist div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.changelist span{opacity:.55;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
</style></head><body>
<header><div class="shell"><div class="top"><div><h1>Cadence</h1><div class="sub">Books &amp; audiobooks</div></div><div class="count" id="count"></div></div>
<div class="controls"><input class="search" id="search" type="search" placeholder="Search title or author…"><select class="select" id="sort"><option value="title">A–Z</option><option value="semantic">Read state</option><option value="genre">Genre</option><option value="color">Cover color</option></select><select class="select" id="direction"><option value="asc">Ascending</option><option value="desc">Descending</option></select></div>
<div class="filters" id="filters"></div>
<div class="controls" style="padding-bottom:10px"><button class="btn" id="addBtn">+ Add book</button><button class="btn" id="triageBtn">Triage unknown</button><button class="btn primary" id="syncBtn">Sync</button><button class="btn" id="settingsBtn">Settings</button></div>
<div class="syncbar"><span id="syncStatus">Covers load progressively and are cached on this device.</span><button id="refreshCovers">Refresh covers</button></div></div></header>
<main class="shell"><div class="loading" id="loading">Loading library…</div><section class="grid" id="grid"></section><div class="empty" id="empty" style="display:none">No books match this view.</div></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-bar"><span class="grab"></span><button class="btn" id="backbtn">&#8592; Library</button><span id="sheetLabel" class="count"></span></div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>
<script>
/* ============================================================
   Cadence Library
   data/cadence-index.csv is the source of truth, fetched at runtime.
   Edits land in IndexedDB immediately, then sync to GitHub as one commit.
   ============================================================ */

const REPO = (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const path = location.pathname.split("/").filter(Boolean)[0] || "";
  return { owner: m ? m[1] : "", repo: path, branch: "main", file: "data/cadence-index.csv" };
})();
const CSV_URL = "./data/cadence-index.csv";

const semanticColors = { read: "#6B7D68", reading: "#C58A4A", want: "#657C93" };
const semanticLabels = { read: "Read", reading: "Reading", want: "Want to read" };
const spineInks = ["#6B5B4A","#8A5B44","#4C5B63","#6B7D68","#8A7645","#5A4E63","#7A4F4F","#48605A"];

let BOOKS = [], COLUMNS = [], OVERLAY = {}, FILE_SHA = null;
const state = { filter: "all", sort: "title", direction: "asc", query: "" };

const $ = s => document.querySelector(s);
const grid=$("#grid"), count=$("#count"), empty=$("#empty"), loading=$("#loading"),
      filters=$("#filters"), search=$("#search"), sort=$("#sort"), direction=$("#direction"),
      syncStatus=$("#syncStatus"), scrim=$("#scrim"), sheet=$("#sheet"),
      sheetBody=$("#sheetBody"), sheetLabel=$("#sheetLabel");

function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function rgbHue(rgb){if(!rgb)return 9999;let[r,g,b]=rgb.map(x=>x/255),max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return h}

/* --- the three-state rule. Single source of truth, was build.py's semantic(). --- */
function semantic(row){
  const r = String(row.read || "").trim().toLowerCase();
  if (!["no","n","false","0"].includes(r) && r) return "read";
  const s = String(row.status || "").trim().toLowerCase();
  if (s === "finished") return "read";
  if (s === "reading") return "reading";
  return "want";
}

/* --- CSV parse / serialize (RFC4180-ish, handles quotes and newlines) --- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){cell+='"';i++} else q=false }
      else cell+=c;
    } else if(c === '"') q=true;
    else if(c === ","){ row.push(cell); cell="" }
    else if(c === "\n"){ row.push(cell); rows.push(row); row=[]; cell="" }
    else cell+=c;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row) }
  const head = rows.shift() || [];
  return { columns: head, rows: rows.filter(r=>r.some(c=>c!=="")).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=r[i] ?? ""); return o;
  })};
}
function csvCell(v){
  const s = v == null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCSV(columns, rows){
  return columns.join(",") + "\n" +
    rows.map(r => columns.map(c => csvCell(r[c])).join(",")).join("\n") + "\n";
}

/* --- IndexedDB: covers, edit overlay, settings. All calls fail soft. --- */
function dbOpen(){return new Promise((res,rej)=>{
  const q=indexedDB.open("cadence-library",2);
  q.onupgradeneeded=e=>{const db=q.result;
    if(!db.objectStoreNames.contains("covers"))db.createObjectStore("covers");
    if(!db.objectStoreNames.contains("overlay"))db.createObjectStore("overlay");
    if(!db.objectStoreNames.contains("settings"))db.createObjectStore("settings")};
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error)})}
async function idbGet(store,k){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(store,k,v){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbDel(store,k){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbClear(store){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbAll(store){const db=await dbOpen();return new Promise((res,rej)=>{const out={};const r=db.transaction(store,"readonly").objectStore(store).openCursor();r.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}

const dbGet=k=>idbGet("covers",k), dbSet=(k,v)=>idbSet("covers",k,v), dbClear=()=>idbClear("covers");

/* --- derive display fields; applies the overlay on top of CSV rows --- */
function decorate(b){
  const o = OVERLAY[b.id];
  if(o && o.fields) Object.assign(b, o.fields);
  const col = String(b.deleted || "").trim().toLowerCase();
  const tombstoned = col !== "" && !["no","n","false","0"].includes(col);
  b._deleted = tombstoned || !!(o && o.deleted);
  b._title=(b.title||"").trim()||"Untitled";
  b._author=(b.author||"").trim()||"";
  b._status=(b.status||"").trim().toLowerCase();
  b._semantic=semantic(b);
  b._edited=!!o;
  b._new=!!(o&&o.isNew);
  if(b._ink===undefined){b._ink=spineInks[hash(b._title+b._author)%spineInks.length];b._genre="";b._cover="";b._rgb=null;b._tried=false}
  return b;
}
function rebuild(){ BOOKS.forEach(decorate) }
function pendingCount(){ return Object.keys(OVERLAY).length }

async function markDeleted(id){
  const b = BOOKS.find(x=>x.id===id);
  const prev = OVERLAY[id] || {};
  if(prev.isNew){
    // Never synced, so there is nothing on GitHub to remove. Just drop it.
    delete OVERLAY[id];
    try{ await idbDel("overlay", id) }catch(e){}
    const i = BOOKS.findIndex(x=>x.id===id);
    if(i>-1) BOOKS.splice(i,1);
  } else {
    OVERLAY[id] = { fields: Object.assign({}, prev.fields, {deleted:"yes"}), deleted: true,
                    title: b ? b._title : id,
                    note_file: b ? (b.note_file||"").trim() : "", at: Date.now() };
    try{ await idbSet("overlay", id, OVERLAY[id]) }catch(e){}
    if(b) decorate(b);
  }
  updateSyncBar();
}

async function setEdit(id, fields, isNew){
  const prev = OVERLAY[id] || {};
  OVERLAY[id] = { fields: Object.assign({}, prev.fields, fields), isNew: isNew || prev.isNew || false, at: Date.now() };
  try{ await idbSet("overlay", id, OVERLAY[id]) }catch(e){}
  const b = BOOKS.find(x=>x.id===id);
  if(b) decorate(b);
  updateSyncBar();
}

function updateSyncBar(){
  const n = pendingCount();
  syncStatus.innerHTML = n
    ? `<span class="pending"><i></i>${n} unsynced change${n===1?"":"s"}</span>`
    : "Covers load progressively and are cached on this device.";
}

/* --- cover lookup (unchanged behaviour, six workers, viewport driven) --- */
function cleanTitle(t){return t.replace(/\s*\((Unabridged|Abridged|[^)]*Edition[^)]*|Travel Guide|Vintage International|[^)]*Book Club[^)]*)\)\s*/gi," ").replace(/:\s.*$/,"").replace(/\s+[A-Za-z]{1,3}$/,"").replace(/\s{2,}/g," ").trim()}
function cleanAuthor(a){return a.split(/[,;]/)[0].replace(/\s-\s.*$/,"").trim()}
async function sampleImageColor(url){
  try{
    const img=new Image();img.crossOrigin="anonymous";img.src=url;
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});
    const c=document.createElement("canvas");c.width=16;c.height=24;
    const x=c.getContext("2d",{willReadFrequently:true});
    x.drawImage(img,0,0,16,24);
    const d=x.getImageData(0,0,16,24).data;
    let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=16){if(d[i+3]<180)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}
    return n?[Math.round(r/n),Math.round(g/n),Math.round(b/n)]:null
  }catch(e){return null}
}
async function ensureCover(b){
  const key=`${b._title}|${b._author}`;
  try{const c=await dbGet(key);if(c){b._cover=c.url||"";b._genre=c.genre||"";b._rgb=c.rgb||null;return !!b._cover}}catch(e){}
  let hit=null;
  try{
    const u=new URL("https://openlibrary.org/search.json");
    u.searchParams.set("title",cleanTitle(b._title));
    if(b._author)u.searchParams.set("author",cleanAuthor(b._author));
    u.searchParams.set("limit","1");
    u.searchParams.set("fields","cover_i,subject");
    const r=await fetch(u);
    if(r.ok){const d=await r.json();hit=d.docs&&d.docs[0]}
  }catch(e){}
  if(!hit||!hit.cover_i){try{await dbSet(key,{url:"",genre:"",rgb:null})}catch(e){}return false}
  const cover=`https://covers.openlibrary.org/b/id/${hit.cover_i}-M.jpg`;
  const genre=Array.isArray(hit.subject)&&hit.subject.length?String(hit.subject[0]).split("--")[0].slice(0,50):"";
  const rgb=await sampleImageColor(cover);
  b._cover=cover;b._genre=genre;b._rgb=rgb;
  try{await dbSet(key,{url:cover,genre,rgb})}catch(e){}
  return true
}
const queue=[];let running=0,fetched=0,attempted=0;
function pump(){
  while(running<6&&queue.length){
    const job=queue.shift();running++;
    ensureCover(job.book).then(ok=>{if(ok){fetched++;paintCover(job.book)}}).catch(()=>{}).finally(()=>{
      running--;attempted++;
      if(!queue.length&&!running&&!pendingCount())syncStatus.textContent=`${fetched} of ${attempted} covers found. Cached on this device.`;
      pump()
    })
  }
}
function paintCover(b){
  if(!b._cover)return;
  document.querySelectorAll(`.book[data-id="${CSS.escape(b.id)}"] .coverwrap`).forEach(w=>{
    if(w.querySelector("img.cover"))return;
    const img=new Image();img.className="cover";img.alt="";
    img.onload=()=>img.classList.add("loaded");img.onerror=()=>img.remove();
    img.src=b._cover;w.insertBefore(img,w.querySelector(".dot"))
  })
}
const io=new IntersectionObserver(es=>{
  for(const e of es){
    if(!e.isIntersecting)continue;
    io.unobserve(e.target);
    const b=BOOKS.find(x=>x.id===e.target.dataset.id);
    if(!b||b._tried)continue;b._tried=true;
    if(b._cover){paintCover(b);continue}
    queue.push({book:b})
  }
  pump()
},{rootMargin:"600px 0px"});

}
function isUnknown(b){ return !b._deleted && String(b.read||"").trim()==="" && b._semantic==="want" }
function cmp(a,b){
  let av,bv;
  if(state.sort==="semantic"){const o=["read","reading","want"];av=o.indexOf(a._semantic);bv=o.indexOf(b._semantic)}
  else if(state.sort==="genre"){av=(a._genre||"zzzz").toLowerCase();bv=(b._genre||"zzzz").toLowerCase()}
  else if(state.sort==="color"){av=rgbHue(a._rgb);bv=rgbHue(b._rgb)}
  else{av=a._title.toLowerCase();bv=b._title.toLowerCase()}
  let r=typeof av==="number"?av-bv:String(av).localeCompare(String(bv));
  if(!r)r=a._title.localeCompare(b._title);
  return state.direction==="asc"?r:-r
}
function visible(){
  const q=state.query.toLowerCase();
  return BOOKS.filter(b=>{
    if(b._deleted) return false;
    let ok;
    if(state.filter==="all")ok=true;
    else if(state.filter==="unknown")ok=isUnknown(b);
    else if(state.filter==="notes")ok=!!(b.note_file||"").trim();
    else ok=b._semantic===state.filter;
    const sq=!q||`${b._title} ${b._author}`.toLowerCase().includes(q);
    return ok&&sq
  }).sort(cmp)
}
function card(b,i){

}

/* --- markdown (headings, paragraphs, lists, bold, italic, bare links) --- */
function mdToHtml(src){
  const e=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const inline=t=>e(t).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>")
    .replace(/\bhttps?:\/\/[^\s<)]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,"").slice(0,44)}</a>`);
  const out=[];let list=null;
  for(const raw of src.split("\n")){
    const line=raw.trim();
    if(!line){if(list){out.push(`<ul>${list.join("")}</ul>`);list=null}continue}
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){if(list){out.push(`<ul>${list.join("")}</ul>`);list=null}out.push(`<h3>${inline(h[2])}</h3>`);continue}
    const li=line.match(/^[-*]\s+(.*)$/);
    if(li){(list=list||[]).push(`<li>${inline(li[1])}</li>`);continue}
    if(list){out.push(`<ul>${list.join("")}</ul>`);list=null}
    out.push(`<p>${inline(line)}</p>`)
  }
  if(list)out.push(`<ul>${list.join("")}</ul>`);
  return out.join("")
}
function splitFrontmatter(text){
  if(!text.startsWith("---"))return[{},text];
  const end=text.indexOf("\n---",3);
  if(end<0)return[{},text];
  const meta={};
  for(const line of text.slice(3,end).split("\n")){
    const i=line.indexOf(":");
    if(i>0){const k=line.slice(0,i).trim(),v=line.slice(i+1).trim();if(v)meta[k]=v}
  }
  return[meta,text.slice(end+4).replace("(none yet)","").trim()]
}

  }catch(e){ noteCache[rel]=null }
  return noteCache[rel];
}

let triQueue=[],triIndex=0;
function openTriage(){
  triQueue=BOOKS.filter(isUnknown).sort(cmp);triIndex=0;

  sheetOpen="triage";openSheet("Triage");drawTriage()
}
function drawTriage(){
  if(triIndex>=triQueue.length){
    sheetBody.innerHTML=`<p class="nonote" style="padding:40px 0;text-align:center">Done for now. ${pendingCount()} unsynced change${pendingCount()===1?"":"s"}.<br>Press Sync when you are ready.</p>`;

  }
  const b=triQueue[triIndex];
  const cover=b._cover?`<img src="${esc(b._cover)}" alt="">`:`<div class="fallback" style="background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(0,0,0,.16) 90%),${b._ink}"><div class="fallback-title">${esc(b._title)}</div><div class="fallback-author">${esc(b._author)}</div></div>`;
  sheetBody.innerHTML=`<div class="tri-wrap">
    <div class="tri-prog">${triIndex+1} of ${triQueue.length} unknown</div>

    <div><h2 class="tri-title">${esc(b._title)}</h2><p class="tri-author">${esc(b._author)||"Author unknown"}</p></div>
    <div class="tri-meta">${[b.format,b._status,b.first_seen].filter(Boolean).map(esc).join(" &middot; ")}</div>
    <div class="tri-actions">
      <button class="btn" data-tri="read">Read it</button>
      <button class="btn" data-tri="reading">Reading</button>
      <button class="btn" data-tri="want">Not yet</button>
    </div>
    <div class="tri-skip"><button data-tri="skip">Skip, not sure</button></div>
  </div>`;
  if(!b._tried){b._tried=true;queue.push({book:b});pump()}
  sheetBody.querySelectorAll("[data-tri]").forEach(btn=>btn.onclick=async()=>{
    const k=btn.dataset.tri;
    if(k!=="skip"){
      const fields = k==="read"?{read:"yes"}:k==="reading"?{read:"",status:"reading"}:{read:"no"};
      await setEdit(b.id, fields);
    }
    triIndex++;drawTriage();render()
  })
}

/* --- add a book (voice friendly: plain text inputs get the iOS mic key) --- */
function slugId(t,a){
  const base=`${t} ${a}`.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,56).replace(/-$/,"")||"untitled";
  // A tombstone with this slug means the book was deleted before. Reuse the id
  // so adding it back revives that row instead of stacking "-2" beside it.
  const tomb=BOOKS.find(b=>b.id===base&&b._deleted);
  if(tomb)return base;
  let id=base,n=1;
  while(BOOKS.some(b=>b.id===id)){n++;id=`${base}-${n}`}
  return id
}
function openAdd(){
  sheetOpen="add";
  const today=new Date().toISOString().slice(0,10);
  sheetBody.innerHTML=`<h2 class="d-title" style="margin-bottom:16px">Add a book</h2>
  <div class="field"><label for="aTitle">Title</label><input id="aTitle" type="text" autocapitalize="words" placeholder="Tap the mic and say the title"></div>
  <div class="field"><label for="aAuthor">Author</label><input id="aAuthor" type="text" autocapitalize="words"></div>
  <div class="row2">
    <div class="field"><label for="aFormat">Format</label><select id="aFormat"><option value="">Unspecified</option><option value="print">Print</option><option value="ebook">Ebook</option><option value="audiobook">Audiobook</option><option value="library">Library</option></select></div>
    <div class="field"><label for="aState">Reading state</label><select id="aState"><option value="want">Want to read</option><option value="reading">Reading</option><option value="read">Read</option></select></div>
  </div>
  <div class="field"><label for="aStatus">Acquired as</label><select id="aStatus"><option value="owned">Owned</option><option value="borrowed">Borrowed</option><option value="wishlist">Wishlist</option><option value="uncertain">Uncertain</option></select></div>
  <div class="actions"><button class="btn" id="aCancel">Cancel</button><button class="btn primary" id="aSave">Add book</button></div>
  <div class="note-status" id="aStatusMsg"></div>`;
  openSheet("Add");
  document.getElementById("aCancel").onclick=()=>closeSheet();
  document.getElementById("aSave").onclick=async()=>{
    const t=document.getElementById("aTitle").value.trim();
    const msg=document.getElementById("aStatusMsg");
    if(!t){msg.className="note-status err";msg.textContent="A title is required.";return}
    const a=document.getElementById("aAuthor").value.trim();
    const st=document.getElementById("aState").value;
    const row={};COLUMNS.forEach(c=>row[c]="");
    row.id=slugId(t,a);row.title=t;row.author=a;
    row.format=document.getElementById("aFormat").value;
    row.status=st==="reading"?"reading":document.getElementById("aStatus").value;
    row.read=st==="read"?"yes":"";
    row.first_seen=today;row.events="1";row.sources="app";
    row.deleted="";
    const existing=BOOKS.findIndex(b=>b.id===row.id);

    if(reviving)BOOKS[existing]=decorate(row); else BOOKS.unshift(decorate(row));
    if(reviving){
      delete OVERLAY[row.id];
      try{await idbDel("overlay",row.id)}catch(e){}
      await setEdit(row.id,row,false);
    } else {
      await setEdit(row.id,row,true);
    }
    render();
    msg.className="note-status ok";msg.textContent=`Added "${t}". Press Sync to commit it.`;
    document.getElementById("aTitle").value="";document.getElementById("aAuthor").value="";
    document.getElementById("aTitle").focus()
  }
}

/* --- sync: one commit for the whole batch --- */
function b64(str){
  const bytes=new TextEncoder().encode(str);
  let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin)
}
function changeSummary(){
  return Object.entries(OVERLAY).map(([id,o])=>{
    const b=BOOKS.find(x=>x.id===id);
    const what=o.deleted?"removed":o.isNew?"added":(b?semanticLabels[b._semantic]:"edited");
    return {title:(b?b._title:o.title||id), what}
  })
}
async function ghReason(r){
  try{const j=await r.json();return j&&j.message?`GitHub said: ${j.message}`:""}catch(e){return ""}
}
async function openSync(){
  sheetOpen="sync";
  const changes=changeSummary();
  sheetBody.innerHTML=`<h2 class="d-title" style="margin-bottom:6px">Sync to GitHub</h2>
  <p class="hint" style="margin-bottom:18px">${changes.length?`${changes.length} change${changes.length===1?"":"s"} will be written to <code>${esc(REPO.file)}</code> as a single commit on <code>${esc(REPO.branch)}</code>.`:"Nothing to sync. Every change on this device is already committed."}</p>
  ${changes.length?`<div class="changelist">${changes.map(c=>`<div><em>${esc(c.title)}</em><span>${esc(c.what)}</span></div>`).join("")}</div>`:""}
  ${changes.length?`<div class="actions"><button class="btn" id="yCancel">Not now</button><button class="btn primary" id="yGo">Commit ${changes.length}</button></div>`:""}
  <div class="note-status" id="yMsg"></div>`;
  openSheet("Sync");
  if(!changes.length)return;
  document.getElementById("yCancel").onclick=()=>closeSheet();
  document.getElementById("yGo").onclick=()=>doSync();
}
async function doSync(){
  const msg=document.getElementById("yMsg"), go=document.getElementById("yGo");
  const fail=t=>{msg.className="note-status err";msg.textContent=t;if(go)go.disabled=false};
  const token=await idbGet("settings","token").catch(()=>null);
  if(!token)return fail("No GitHub token saved. Add one under Settings.");
  if(!REPO.owner||!REPO.repo)return fail("Owner and repo are not set. Check Settings.");
  if(go)go.disabled=true;
  msg.className="note-status";msg.textContent="Reading the current file…";
  const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.file}`;
  const H={Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  let sha=null, remoteRows=null, remoteCols=null;
  try{
    const r=await fetch(`${api}?ref=${REPO.branch}`,{headers:H});
    if(r.status===404)return fail(`No ${REPO.file} on ${REPO.owner}/${REPO.repo}@${REPO.branch}. Check Owner and Repo in Settings.`);
    if(!r.ok)return fail(`Could not read the file (HTTP ${r.status}). ${await ghReason(r)}`);
    const j=await r.json();sha=j.sha;
    const text=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")),c=>c.charCodeAt(0)));
    const p=parseCSV(text);remoteCols=p.columns;remoteRows=p.rows;
    if(!remoteCols.includes("deleted")){remoteCols.push("deleted");remoteRows.forEach(r=>r.deleted=r.deleted||"")}
  }catch(e){return fail("Network error reading the file: "+e.message)}

  // Merge onto the remote copy, not the local one, so another device's edits survive.
  const byId={};remoteRows.forEach(r=>byId[r.id]=r);
  let added=0,updated=0,removed=0;
  const orphanNotes=[];
  for(const [id,o] of Object.entries(OVERLAY)){
    if(o.deleted){
      // Tombstone, not erasure. A bare row survives a future re-import and stops
      // the book coming back; everything about its history is cleared.
      const row=byId[id];
      if(row){
        remoteCols.forEach(c=>{ if(!["id","title","author"].includes(c)) row[c]="" });
        row.deleted=new Date().toISOString().slice(0,10);
        removed++
      }
      if(o.note_file)orphanNotes.push(o.note_file);
      continue
    }
    if(byId[id]){Object.assign(byId[id],o.fields);updated++}
    else{const row={};remoteCols.forEach(c=>row[c]="");Object.assign(row,o.fields);row.id=id;remoteRows.unshift(row);byId[id]=row;added++}
  }
  msg.textContent="Committing…";
  const parts=[updated?`${updated} updated`:"",added?`${added} added`:"",removed?`${removed} removed`:""].filter(Boolean);
  const body={message:`Cadence: ${parts.join(", ")||"no-op"}`,content:b64(toCSV(remoteCols,remoteRows)),branch:REPO.branch,sha};
  try{
    const r=await fetch(api,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify(body)});
    if(r.status===409)return fail("The file changed on GitHub while you were editing. Reload and try again.");
    if(r.status===403||r.status===401){
      const scopes=r.headers.get("x-accepted-github-permissions")||"";
      return fail(`Write refused (HTTP ${r.status}). ${await ghReason(r)} This token can read the repo but not write to it. In the token settings check that Repository access includes ${REPO.owner}/${REPO.repo}, and that Permissions > Contents is "Read and write", not "Read-only".${scopes?" GitHub wants: "+scopes:""}`);
    }
    if(r.status===422)return fail(`GitHub rejected the content (HTTP 422). ${await ghReason(r)} Often a protected branch on ${REPO.branch}.`);
    if(!r.ok)return fail(`Commit rejected (HTTP ${r.status}). ${await ghReason(r)}`);
  }catch(e){return fail("Network error committing: "+e.message)}
  // Note files are separate objects in git, so each needs its own delete call.
  let notesGone=0,notesFailed=0;
  for(const rel of orphanNotes){
    msg.textContent=`Deleting ${rel}…`;
    try{
      const nApi=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${rel}`;
      const g=await fetch(`${nApi}?ref=${REPO.branch}`,{headers:H});
      if(g.status===404){notesGone++;continue}
      if(!g.ok){notesFailed++;continue}
      const gj=await g.json();
      const d=await fetch(nApi,{method:"DELETE",headers:Object.assign({"Content-Type":"application/json"},H),
        body:JSON.stringify({message:`Cadence: remove ${rel}`,sha:gj.sha,branch:REPO.branch})});
      d.ok?notesGone++:notesFailed++;
    }catch(e){notesFailed++}
  }
  for(const id of Object.keys(OVERLAY)){
    if(!OVERLAY[id].deleted)continue;
    const b=BOOKS.find(x=>x.id===id);
    if(!b)continue;
    COLUMNS.forEach(c=>{ if(!["id","title","author"].includes(c)) b[c]="" });
    b.deleted=new Date().toISOString().slice(0,10);
  }
  OVERLAY={};try{await idbClear("overlay")}catch(e){}
  rebuild();render();updateSyncBar();
  msg.className="note-status ok";
  msg.textContent=`Committed: ${parts.join(", ")||"nothing"}.`
    + (notesGone?` ${notesGone} note file${notesGone===1?"":"s"} deleted.`:"")
    + (notesFailed?` ${notesFailed} note file${notesFailed===1?"":"s"} could not be deleted; remove by hand.`:"")
    + ` GitHub Pages takes about a minute to redeploy.`;
  if(go)go.disabled=false
}

/* --- wiring and boot --- */
search.oninput=e=>{state.query=e.target.value.trim();render()};
sort.onchange=e=>{state.sort=e.target.value;render()};
direction.onchange=e=>{state.direction=e.target.value;render()};
document.getElementById("addBtn").onclick=()=>openAdd();
document.getElementById("triageBtn").onclick=()=>openTriage();
document.getElementById("syncBtn").onclick=()=>openSync();
document.getElementById("settingsBtn").onclick=()=>openSettings();
document.getElementById("refreshCovers").onclick=async()=>{
  try{await dbClear()}catch(e){}
  BOOKS.forEach(b=>{b._cover="";b._genre="";b._rgb=null;b._tried=false});
  fetched=0;attempted=0;queue.length=0;
  syncStatus.textContent="Cover cache cleared. Reloading…";render()
};
window.addEventListener("beforeunload",e=>{
  if(pendingCount()){e.preventDefault();e.returnValue=""}
});

async function boot(){
  try{
    const saved=await idbGet("settings","repo").catch(()=>null);
    if(saved&&saved.owner){REPO.owner=saved.owner;REPO.repo=saved.repo}
  }catch(e){}
  try{ OVERLAY = await idbAll("overlay") }catch(e){ OVERLAY={} }

  let text=null;
  try{
    const r=await fetch(CSV_URL,{cache:"no-cache"});
    if(r.ok)text=await r.text();
  }catch(e){}
  if(text===null){
    loading.innerHTML=`Could not load <code>${esc(CSV_URL)}</code>.<br><br>If you opened this file directly from disk, browsers block that fetch. Run <code>python3 -m http.server 8000</code> in the repo and open <code>localhost:8000</code> instead.`;
    return
  }
  const parsed=parseCSV(text);
  COLUMNS=parsed.columns;
  if(!COLUMNS.includes("id")){loading.textContent="The CSV has no id column. Every row needs a stable id.";return}
  if(!COLUMNS.includes("read"))COLUMNS.push("read");
  BOOKS=parsed.rows.map(decorate);

  // overlay rows for books that are not in the CSV yet (added on this device)
  for(const [id,o] of Object.entries(OVERLAY)){
    if(o.isNew&&!BOOKS.some(b=>b.id===id)){
      const row={};COLUMNS.forEach(c=>row[c]="");Object.assign(row,o.fields);row.id=id;
      BOOKS.unshift(decorate(row))
    }
  }
  loading.style.display="none";
  renderFilters();render();updateSyncBar();

  const m=location.hash.match(/^#\/book\/(.+)$/);
  if(m){const b=BOOKS.find(x=>x.id===decodeURIComponent(m[1]));if(b)openDetail(b,false)}
}
boot();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
</script></body></html>
